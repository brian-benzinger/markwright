<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Markwright</title>
    <script src="https://appsforoffice.microsoft.com/lib/1.1/hosted/office.js"></script>
    <link rel="stylesheet" href="taskpane.css" />
  </head>
  <body>
    <main id="app" hidden>
      <header>
        <h1>Markwright</h1>
        <p class="tagline">Paste markdown, click Convert.</p>
      </header>

      <section class="input">
        <label for="markdown-input" class="sr-only">Markdown input</label>
        <textarea
          id="markdown-input"
          spellcheck="false"
          placeholder="# Paste your markdown here"
        ></textarea>
      </section>

      <section class="actions">
        <button id="convert" type="button">Convert</button>
        <button
          id="styles-toggle"
          type="button"
          class="secondary"
          aria-expanded="false"
          aria-controls="styles-panel"
        >
          Styles
        </button>
        <span id="status" role="status" aria-live="polite"></span>
      </section>

      <section id="styles-panel" class="styles-panel" hidden>
        <p class="styles-help">
          Map each Markdown construct to a Word style. “(Default)” keeps the built-in style.
        </p>
        <div id="styles-grid" class="styles-grid"></div>
        <div class="styles-actions">
          <button id="styles-save" type="button">Save mapping</button>
          <span id="styles-status" role="status" aria-live="polite"></span>
        </div>
      </section>
    </main>

    <div id="unsupported" hidden>
      <p>Markwright needs to run inside Microsoft Word.</p>
    </div>
  </body>
</html>
