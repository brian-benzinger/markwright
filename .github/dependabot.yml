version: 2

updates:
  # Keep npm dependencies current.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Bundle all minor/patch bumps into one PR per week so the queue
      # stays manageable. Major bumps still arrive individually (they can
      # break the build and need a human eye).
      minor-and-patch:
        update-types:
          - minor
          - patch

  # Keep GitHub Actions current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
